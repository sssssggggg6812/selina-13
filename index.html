<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ESP32 电机控制面板</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/paho-mqtt/1.0.1/mqttws31.js" type="text/javascript"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .container {
            background: white;
            border-radius: 20px;
            padding: 30px;
            max-width: 600px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        
        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 30px;
            font-size: 2.2rem;
        }
        
        .section {
            background: #f8f9fa;
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 20px;
        }
        
        .section-title {
            font-size: 1.2rem;
            font-weight: bold;
            color: #495057;
            margin-bottom: 15px;
        }
        
        .input-group {
            margin-bottom: 15px;
        }
        
        label {
            display: block;
            margin-bottom: 5px;
            color: #6c757d;
            font-weight: 500;
        }
        
        input[type="text"],
        input[type="password"] {
            width: 100%;
            padding: 10px;
            border: 2px solid #dee2e6;
            border-radius: 8px;
            font-size: 1rem;
            transition: border-color 0.3s;
        }
        
        input[type="text"]:focus,
        input[type="password"]:focus {
            outline: none;
            border-color: #667eea;
        }
        
        .btn-connect {
            background: #667eea;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            font-size: 1rem;
            cursor: pointer;
            width: 100%;
            transition: background 0.3s;
        }
        
        .btn-connect:hover {
            background: #5a67d8;
        }
        
        .btn-connect.connected {
            background: #48bb78;
        }
        
        .control-buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }
        
        .btn-control {
            padding: 15px;
            border: none;
            border-radius: 10px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            color: white;
        }
        
        .btn-control:active {
            transform: scale(0.95);
        }
        
        .btn-cw {
            background: #27ae60;
        }
        
        .btn-cw:hover {
            background: #219a52;
        }
        
        .btn-ccw {
            background: #e67e22;
        }
        
        .btn-ccw:hover {
            background: #d35400;
        }
        
        .btn-stop {
            background: #e74c3c;
            grid-column: span 2;
        }
        
        .btn-stop:hover {
            background: #c0392b;
        }
        
        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        .status-display {
            text-align: center;
            padding: 15px;
            background: #e9ecef;
            border-radius: 10px;
            margin-top: 20px;
        }
        
        .status-text {
            font-size: 1.2rem;
            font-weight: bold;
            color: #495057;
        }
        
        .duration-input {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 15px;
        }
        
        .duration-input input {
            width: 60px;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>⚙️ ESP32 电机控制</h1>
        
        <!-- MQTT设置 -->
        <div class="section">
            <div class="section-title">MQTT 设置</div>
            <div class="input-group">
                <label>服务器地址</label>
                <input type="text" id="mqttUrl" placeholder="例如：broker.hivemq.com" value="broker.hivemq.com">
            </div>
            <div class="input-group">
                <label>用户名</label>
                <input type="text" id="mqttUsername" placeholder="MQTT用户名">
            </div>
            <div class="input-group">
                <label>密码</label>
                <input type="password" id="mqttPassword" placeholder="MQTT密码">
            </div>
            <button class="btn-connect" id="btnConnect" onclick="connectMQTT()">连接MQTT</button>
        </div>
        
        <!-- 电机控制 -->
        <div class="section">
            <div class="section-title">电机控制</div>
            <div class="duration-input">
                <label>旋转时长（秒）:</label>
                <input type="number" id="duration" value="3" min="0" max="60">
            </div>
            <div class="control-buttons">
                <button class="btn-control btn-cw" id="btnCW" onclick="rotateCW()" disabled>🔄 顺时针</button>
                <button class="btn-control btn-ccw" id="btnCCW" onclick="rotateCCW()" disabled>🔃 逆时针</button>
                <button class="btn-control btn-stop" id="btnStop" onclick="stopMotor()" disabled>⏹️ 停止</button>
            </div>
        </div>
        
        <!-- 状态显示 -->
        <div class="status-display">
            <span class="status-text" id="statusText">未连接</span>
        </div>
    </div>
    
    <script>
        let mqttClient = null;
        let isConnected = false;
        
        // MQTT主题
        const TOPIC_SUBSCRIBE = "esp32/motor/status";
        const TOPIC_PUBLISH = "esp32/motor/control";
        
        function connectMQTT() {
            const url = document.getElementById('mqttUrl').value;
            const username = document.getElementById('mqttUsername').value;
            const password = document.getElementById('mqttPassword').value;
            
            if (!url) {
                alert('请输入MQTT服务器地址');
                return;
            }
            
            // 使用WebSocket端口8884
            const wsUrl = `wss://${url}:8884/mqtt`;
            
            try {
                mqttClient = new Paho.MQTT.Client(wsUrl, "web_" + Math.random().toString(16).substr(2, 8));
                
                mqttClient.onConnectionLost = onConnectionLost;
                mqttClient.onMessageArrived = onMessageArrived;
                
                const options = {
                    useSSL: true,
                    userName: username || undefined,
                    password: password || undefined,
                    onSuccess: onConnect,
                    onFailure: onFailure,
                    reconnect: true,
                    keepAliveInterval: 30
                };
                
                mqttClient.connect(options);
                
                document.getElementById('btnConnect').textContent = '连接中...';
                document.getElementById('btnConnect').disabled = true;
                
            } catch (error) {
                console.error('MQTT连接错误:', error);
                alert('MQTT连接失败: ' + error.message);
            }
        }
        
        function onConnect() {
            isConnected = true;
            console.log('MQTT已连接');
            
            document.getElementById('btnConnect').textContent = '已连接';
            document.getElementById('btnConnect').classList.add('connected');
            document.getElementById('btnConnect').disabled = false;
            
            // 启用控制按钮
            document.getElementById('btnCW').disabled = false;
            document.getElementById('btnCCW').disabled = false;
            document.getElementById('btnStop').disabled = false;
            
            document.getElementById('statusText').textContent = '已连接';
            
            // 订阅状态主题
            mqttClient.subscribe(TOPIC_SUBSCRIBE);
        }
        
        function onFailure(error) {
            console.error('MQTT连接失败:', error);
            isConnected = false;
            
            document.getElementById('btnConnect').textContent = '连接失败，重试';
            document.getElementById('btnConnect').disabled = false;
            document.getElementById('statusText').textContent = '连接失败';
            
            alert('MQTT连接失败，请检查设置');
        }
        
        function onConnectionLost(responseObject) {
            if (responseObject.errorCode !== 0) {
                console.log('MQTT连接丢失:', responseObject.errorMessage);
                isConnected = false;
                
                document.getElementById('btnConnect').textContent = '重新连接';
                document.getElementById('btnConnect').classList.remove('connected');
                document.getElementById('btnConnect').disabled = false;
                
                document.getElementById('btnCW').disabled = true;
                document.getElementById('btnCCW').disabled = true;
                document.getElementById('btnStop').disabled = true;
                
                document.getElementById('statusText').textContent = '连接丢失';
            }
        }
        
        function onMessageArrived(message) {
            console.log('收到消息:', message.payloadString);
            
            try {
                const data = JSON.parse(message.payloadString);
                if (data.status === 'running') {
                    document.getElementById('statusText').textContent = `运行中 - ${data.direction === 'cw' ? '顺时针' : '逆时针'}`;
                } else {
                    document.getElementById('statusText').textContent = '已停止';
                }
            } catch (e) {
                console.error('解析消息失败:', e);
            }
        }
        
        function rotateCW() {
            if (!isConnected || !mqttClient) {
                alert('请先连接MQTT');
                return;
            }
            
            const duration = document.getElementById('duration').value || 3;
            const message = {
                command: 'cw',
                duration: parseInt(duration)
            };
            
            publishMessage(message);
            document.getElementById('statusText').textContent = `顺时针旋转 ${duration} 秒`;
        }
        
        function rotateCCW() {
            if (!isConnected || !mqttClient) {
                alert('请先连接MQTT');
                return;
            }
            
            const duration = document.getElementById('duration').value || 3;
            const message = {
                command: 'ccw',
                duration: parseInt(duration)
            };
            
            publishMessage(message);
            document.getElementById('statusText').textContent = `逆时针旋转 ${duration} 秒`;
        }
        
        function stopMotor() {
            if (!isConnected || !mqttClient) {
                alert('请先连接MQTT');
                return;
            }
            
            const message = {
                command: 'stop'
            };
            
            publishMessage(message);
            document.getElementById('statusText').textContent = '停止';
        }
        
        function publishMessage(message) {
            const payload = JSON.stringify(message);
            const mqttMessage = new Paho.MQTT.Message(payload);
            mqttMessage.destinationName = TOPIC_PUBLISH;
            mqttMessage.qos = 1;
            mqttClient.send(mqttMessage);
            console.log('发送消息:', payload);
        }
    </script>
</body>
</html>
